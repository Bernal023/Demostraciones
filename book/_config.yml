# Jupyter Book 1.x — configuración
title: Demostraciones de Machine Learning
author: Machine Learning

execute:
  execute_notebooks: "off"

only_build_toc_files: true

bibtex_bibfiles:
  - references.bib

parse:
  myst_enable_extensions:
    - amsmath
    - colon_fence
    - dollarmath
    - deflist

sphinx:
  config:
    language: es
    bibtex_reference_style: author_year

html:
  use_issues_button: true
  use_repository_button: true
  use_edit_page_button: false
  home_page_in_navbar: true

# Cambia USUARIO/REPOSITORIO por los tuyos antes de publicar
repository:
  url: https://github.com/USUARIO/REPOSITORIO
  path_to_book: book
  branch: main
